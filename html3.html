<!DOCTYPE html> <html> <head> <title> CSS Recap </title>
    <link rel="stylesheet" href="styles.css">
    <style>
        h1{background-color:aqua;margin:50px;}
        .a{background-color: pink;border:10px;}
        .b{background-color: yellow;padding:10px;}
        #first{font-family: 'Franklin Gothic Medium','Arial Narrow',sans-serif; font-size: 20px;}
        #second{font-family: large;}
    </style> </head>

    <body> <h1> Cascading Style Sheets</h1>
    <p class="a" id="first"> DevOps and Full Stack </p>
    <p class="b"> DevOps and Full Stack </p>
    <p class="a" id="second"> DevOps and Full Stack </p>
    <p class="b"> DevOps and Full Stack </p>
    </body> </html>
